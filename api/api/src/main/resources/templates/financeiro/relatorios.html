<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Shark Food Truck | Relatórios Financeiros</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-color: #0d0d0d; color: #f8f9fa; font-family: 'Segoe UI', sans-serif; }
        .navbar-shark { background-color: #000; border-bottom: 2px solid #007bff; }
        .card-financeiro { background-color: #1a1a1a; border: 1px solid #333; border-radius: 15px; margin-top: 20px; }
        .table { color: #f8f9fa; }
        .text-lucro { color: #2ecc71; font-weight: bold; }
        .text-prejuizo { color: #e74c3c; font-weight: bold; }
        .resumo-card { border-left: 4px solid #007bff; background: #222; padding: 15px; border-radius: 8px; }
    </style>
</head>
<body>

    <nav class="navbar navbar-dark navbar-shark mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/dashboard">🦈 SHARK FINANCE</a>
        </div>
    </nav>

    <div class="container">
        <div class="row mb-4">
            <div class="col">
                <h2 class="fw-bold"><i class="fas fa-chart-line text-primary me-2"></i>Relatórios de Performance</h2>
                <p class="text-muted">Acompanhe a saúde financeira mensal do seu Shark Food Truck.</p>
            </div>
        </div>

        <div class="card card-financeiro shadow">
            <div class="card-body p-4">
                <div class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead class="text-primary border-bottom border-secondary">
                            <tr>
                                <th>Período (Mês/Ano)</th>
                                <th>Faturamento Bruto</th>
                                <th>Custo Insumos</th>
                                <th>Despesas Fixas</th>
                                <th>Lucro Líquido</th>
                                <th class="text-center">Ações</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="r : ${relatorios}">
                                <td th:text="${r.mesReferencia + '/' + r.anoReferencia}" class="fw-bold">05/2026</td>
                                <td th:text="${'R$ ' + r.faturamentoBruto}">R$ 0,00</td>
                                <td th:text="${'R$ ' + r.custoInsumosTotal}" class="text-warning">- R$ 0,00</td>
                                <td th:text="${'R$ ' + r.despesasFixasTotal}" class="text-danger">- R$ 0,00</td>
                                
                                <td th:text="${'R$ ' + r.lucroLiquido}" 
                                    th:class="${r.lucroLiquido >= 0 ? 'text-lucro' : 'text-prejuizo'}">
                                    R$ 0,00
                                </td>

                                <td class="text-center">
                                    <button class="btn btn-sm btn-outline-info"><i class="fas fa-print"></i></button>
                                </td>
                            </tr>
                            <tr th:if="${relatorios.isEmpty()}">
                                <td colspan="6" class="text-center py-4 text-muted">Nenhum fechamento realizado até o momento.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
        
        <div class="mt-4">
            <a href="/dashboard" class="btn btn-secondary btn-sm"><i class="fas fa-arrow-left"></i> Voltar</a>
        </div>
    </div>

</body>
</html>
