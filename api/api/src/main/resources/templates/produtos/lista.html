<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Shark Food Truck | Gestão de Estoque</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-color: #0d0d0d; color: #f8f9fa; font-family: 'Segoe UI', sans-serif; }
        .navbar-shark { background-color: #000; border-bottom: 2px solid #007bff; }
        .card-dark { background-color: #1a1a1a; border: 1px solid #333; border-radius: 15px; }
        .table { color: #f8f9fa; }
        .badge-low { background-color: #ffc107; color: #000; } /* Estoque Baixo */
        .badge-ok { background-color: #28a745; } /* Estoque OK */
        .badge-out { background-color: #dc3545; } /* Esgotado */
        tr:hover { background-color: rgba(0, 123, 255, 0.1); }
    </style>
</head>
<body>

    <nav class="navbar navbar-dark navbar-shark mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/dashboard">🦈 SHARK FOOD TRUCK</a>
        </div>
    </nav>

    <div class="container">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2><i class="fas fa-boxes text-primary"></i> Controle de Produtos e Estoque</h2>
        </div>

        <div class="card card-dark shadow">
            <div class="card-body">
                <table class="table table-hover align-middle">
                    <thead class="text-primary border-bottom border-secondary">
                        <tr>
                            <th>Produto</th>
                            <th>Preço</th>
                            <th class="text-center">Quantidade</th>
                            <th class="text-center">Status</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="p : ${produtos}">
                            <td class="fw-bold" th:text="${p.nome}">Nome</td>
                            <td th:text="${'R$ ' + p.preco}">R$ 0,00</td>
                            
                            <td class="text-center">
                                <span th:text="${p.estoque != null ? p.estoque.quantidadeAtual : 'N/A'}"
                                      th:class="${p.estoque != null && p.estoque.quantidadeAtual <= 5 ? 'text-warning fw-bold' : ''}">
                                    0
                                </span>
                            </td>

                            <td class="text-center">
                                <span th:if="${p.estoque != null && p.estoque.quantidadeAtual > 5}" class="badge badge-ok">Em Estoque</span>
                                <span th:if="${p.estoque != null && p.estoque.quantidadeAtual <= 5 && p.estoque.quantidadeAtual > 0}" class="badge badge-low">Repor Breve</span>
                                <span th:if="${p.estoque == null || p.estoque.quantidadeAtual <= 0}" class="badge badge-out">Esgotado</span>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

</body>
</html>
