<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Truck Admin</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .app-card { border: none; border-radius: 15px; transition: transform 0.2s; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .app-card:hover { transform: translateY(-5px); }
        .navbar-brand { font-weight: bold; color: #ff6b6b !important; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm mb-4">
        <div class="container">
             <a class="navbar-brand" href="#">🚚 Food Truck Manager</a>
        </div>
    </nav>

    <div class="container">
        <div class="row">
            <!-- Card de Produtos -->
            <div class="col-md-6 mb-4">

                <div class="card app-card p-4 text-center">
                    <div class="card-body">
                        <h5 class="card-title text-muted">Produtos</h5>
                        <h2 class="display-4 fw-bold" th:text="${qtdProdutos}">0</h2> 
                        <a href="#" class="btn btn-primary rounded-pill px-4 mt-3">Ver Cardápio</a>
                    </div>
                </div>
            <!-- Card de Usuários -->
                <div class="col-md-6 mb-4">
                    <div class="card app-card p-4 text-center">
                        <div class="card-body">
                            <h5 class="card-title text-muted">Usuários</h5>
                            <h2 class="display-4 fw-bold" th:text="${qtdUsuarios}">0</h2> 
                            <a href="#" class="btn btn-outline-dark rounded-pill px-4 mt-3">Gerenciar</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
