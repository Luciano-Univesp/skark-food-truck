<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Shark Food Truck | Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-color: #0d0d0d; color: #f8f9fa; font-family: 'Urbanist', sans-serif; }
        .navbar-shark { background-color: #000; border-bottom: 2px solid #007bff; }
        .card-stats { 
            background: #1a1a1a; 
            border: none; 
            border-radius: 15px; 
            transition: transform 0.3s;
            border-left: 5px solid #007bff;
        }
        .card-stats:hover { transform: translateY(-5px); }
        .icon-box { 
            width: 50px; height: 50px; 
            background: rgba(0, 123, 255, 0.1); 
            border-radius: 10px; 
            display: flex; align-items: center; justify-content: center;
        }
        .text-neon-blue { color: #00d9ff; text-shadow: 0 0 10px rgba(0, 217, 255, 0.5); }
        .text-neon-green { color: #39ff14; text-shadow: 0 0 10px rgba(57, 255, 20, 0.5); }
        .text-neon-red { color: #ff3131; text-shadow: 0 0 10px rgba(255, 49, 49, 0.5); }

        .text-white-shark {
    color: #ffffff !important;
    opacity: 1 !important;
    font-weight: 500;
        }
        /* Para os botões de acesso rápido ficarem com o texto interno branco */
        .btn-outline-primary {
         color: #ffffff !important;
         border-color: #007bff !important;
        }
        .btn-outline-primary:hover {
            background-color: #007bff !important;
            color: #ffffff !important;
                }
    </style>
</head>
<body>

    <nav class="navbar navbar-dark navbar-shark mb-5">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">🦈 SHARK COMMAND CENTER</a>
            <div class="text-muted small">Bem-vinda, Engenheira Lucia</div>
        </div>
    </nav>

    <div class="container">
        <div class="row g-4">
            
            <div class="col-md-4">
                <div class="card card-stats p-3 shadow">
                    <div class="d-flex align-items-center">
                        <div class="icon-box me-3"><i class="fas fa-cash-register text-primary"></i></div>
                        <div>
                            <p class="text-white-shark mb-0 small uppercase">Vendas do Dia</p>
                            <h3 class="fw-bold text-neon-blue" th:text="'R$ ' + ${vendasHoje}">R$ 0,00</h3>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card card-stats p-3 shadow" style="border-left-color: #ff3131;">
                    <div class="d-flex align-items-center">
                        <div class="icon-box me-3"><i class="fas fa-exclamation-triangle text-danger"></i></div>
                        <div>
                            <p class="text-white-shark mb-0 small">Produtos Críticos</p>
                            <h3 class="fw-bold text-neon-red" th:text="${produtosCriticos}">0</h3>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card card-stats p-3 shadow" style="border-left-color: #39ff14;">
                    <div class="d-flex align-items-center">
                        <div class="icon-box me-3"><i class="fas fa-piggy-bank text-success"></i></div>
                        <div>
                            <p class="text-white-shark mb-0 small">Lucro Líquido (Mês)</p>
                            <h3 class="fw-bold text-neon-green" th:text="'R$ ' + ${ultimoLucro}">R$ 0,00</h3>
                        </div>
                    </div>
                </div>
            </div>

        </div>

        <div class="row mt-5">
            <div class="col-12">
                <h4 class="mb-4 text-white-shark">Acesso Rápido</h4>
                <div class="d-flex gap-3">
                    <a href="/produtos" class="btn btn-outline-primary"><i class="fas fa-hamburger me-2"></i>Cardápio</a>
                    <a href="/financeiro/relatorios" class="btn btn-outline-primary"><i class="fas fa-file-invoice-dollar me-2"></i>Financeiro</a>
                    <a href="/categorias" class="btn btn-outline-primary"><i class="fas fa-tags me-2"></i>Categorias</a>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
